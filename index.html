<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="QR code generator with SVG and PNG export.">
    <title>QR Generator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20261105-7">
    <script src="vendor/qrcode.js" defer></script>
    <script src="script.js?v=20261105-9" defer></script>
  </head>
  <body>
    <main>
      <div class="workspace">
        <div class="preview-column">
          <section id="canvasArea" class="canvas-area" tabindex="0" aria-label="QR code preview. Hold to show QR structure." title="Hold to show QR structure">
            <svg id="qrPreview" role="img" aria-label="Generated QR code"></svg>
          </section>
        </div>

        <div class="controls-column" role="region" aria-label="QR editor" tabindex="0">
          <section class="qr-content" aria-label="QR content">
            <div class="qr-content-toolbar">
              <div id="encodingMode" class="encoding-mode" role="status" aria-live="polite" aria-label="Detected QR encoding: Byte">
                <span data-mode="Byte" class="active">Byte</span>
                <span data-mode="Alphanumeric">Alphanumeric</span>
                <span data-mode="Numeric">Numeric</span>
              </div>
              <div id="qrVersionInfo" class="qr-version-info" role="status" aria-live="polite" aria-hidden="true">
                <span id="previousVersion" class="version-step version-step-previous" aria-hidden="true"></span>
                <div id="qrVersionLabel" class="qr-version-label">
                  <span id="currentVersion">V1</span>
                  <span id="currentDimensions" class="version-dimensions">21×21</span>
                </div>
                <span id="nextVersion" class="version-step version-step-next" aria-hidden="true"></span>
              </div>
            </div>
            <div class="field url-field">
              <label class="visually-hidden" for="urlInput">QR content</label>
              <span id="urlInputWrap" class="url-input-wrap">
                <textarea id="urlInput" rows="1" placeholder="Text or address" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="urlHelp">example.com</textarea>
              </span>
            </div>
            <p id="urlHelp" class="field-help" aria-live="polite" hidden></p>
            <label class="field error-correction-field" for="errorCorrection">
              <span>Error Correction</span>
              <select id="errorCorrection">
                <option value="L">Low · 7%</option>
                <option value="M" selected>Medium · 15%</option>
                <option value="Q">Quartile · 25%</option>
                <option value="H">High · 30%</option>
              </select>
            </label>
            <label id="moduleSeedField" class="field seed-field" for="moduleSeed" hidden>
              <span>Seed</span>
              <span class="range-control">
                <input id="moduleSeed" type="range" min="0" max="4294967295" step="1" value="0">
                <output id="moduleSeedValue" for="moduleSeed">0</output>
              </span>
            </label>
          </section>

          <section class="module-section" aria-labelledby="moduleTitle">
            <h2 id="moduleTitle" class="section-title">Module</h2>
            <div class="controls style-group">
              <label class="field module-style-field style-property" for="moduleStyle">
                <span>Style</span>
                <select id="moduleStyle" aria-label="Module style">
                  <option value="regular-polygon" selected>Regular polygon</option>
                  <option value="figure">Figure</option>
                </select>
              </label>
              <div class="range-field polygon-property style-property">
                <div class="property-heading">
                  <label for="moduleSides">Sides</label>
                  <button type="button" class="shuffle-button" data-module-random="moduleSides" aria-label="Randomize module sides" aria-pressed="false" aria-controls="moduleSidesControl moduleSidesRandomControl" title="Randomize sides">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 3 3 3-3 3m0 6 3 3-3 3M3 6h2c5 0 9 12 14 12h2M3 18h2c5 0 9-12 14-12h2"/></svg>
                  </button>
                </div>
                <span id="moduleSidesControl" class="range-control">
                  <input id="moduleSides" type="range" min="3" max="9" step="1" value="4" aria-label="Module polygon sides">
                  <output id="moduleSidesValue" for="moduleSides">4</output>
                </span>
                <div id="moduleSidesRandomControl" class="random-range" data-module-random-range="moduleSides" role="group" aria-label="Random module sides range" hidden>
                  <output data-bound-value="min" for="moduleSidesMin">3</output>
                  <div class="random-range-track">
                    <span class="random-range-rail" aria-hidden="true"></span>
                    <input id="moduleSidesMin" type="range" min="3" max="9" step="1" value="3" data-bound="min" aria-label="Minimum random module sides">
                    <input id="moduleSidesMax" type="range" min="3" max="9" step="1" value="9" data-bound="max" aria-label="Maximum random module sides">
                  </div>
                  <output data-bound-value="max" for="moduleSidesMax">9</output>
                </div>
              </div>
              <div class="range-field figure-property style-property" role="group" aria-label="Module figures" hidden>
                <div class="figure-control">
                  <button type="button" data-module-figure="cross" aria-label="Cross" title="Cross" aria-pressed="true"><svg viewBox="0 0 1 1" aria-hidden="true"><path/></svg></button>
                  <button type="button" data-module-figure="heart" aria-label="Heart" title="Heart" aria-pressed="false"><svg viewBox="0 0 1 1" aria-hidden="true"><path/></svg></button>
                  <button type="button" data-module-figure="rounded-star" aria-label="Rounded star" title="Rounded star" aria-pressed="false"><svg viewBox="0 0 1 1" aria-hidden="true"><path/></svg></button>
                </div>
              </div>
              <div class="range-field module-size-field style-property">
                <div class="property-heading">
                  <label for="moduleScale">Size</label>
                  <button type="button" class="shuffle-button" data-module-random="moduleScale" aria-label="Randomize module size" aria-pressed="false" aria-controls="moduleScaleControl moduleScaleRandomControl" title="Randomize size">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 3 3 3-3 3m0 6 3 3-3 3M3 6h2c5 0 9 12 14 12h2M3 18h2c5 0 9-12 14-12h2"/></svg>
                  </button>
                  <button id="discreteSizesToggle" type="button" class="shuffle-button" aria-label="Random size steps" title="Random size steps" aria-pressed="false" aria-controls="moduleSizeCountControl">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M4 20v-5h4v5m2 0V9h4v11m2 0V4h4v16"/></svg>
                  </button>
                </div>
                <span id="moduleScaleControl" class="range-control">
                  <input id="moduleScale" type="range" min="70" max="100" step="1" value="100">
                  <output id="moduleScaleValue" for="moduleScale">100%</output>
                </span>
                <div id="moduleScaleRandomControl" class="random-range" data-module-random-range="moduleScale" role="group" aria-label="Random module size range" hidden>
                  <output data-bound-value="min" for="moduleScaleMin">70%</output>
                  <div class="random-range-track">
                    <span class="random-range-rail" aria-hidden="true"></span>
                    <input id="moduleScaleMin" type="range" min="70" max="100" step="1" value="70" data-bound="min" aria-label="Minimum random module size">
                    <input id="moduleScaleMax" type="range" min="70" max="100" step="1" value="100" data-bound="max" aria-label="Maximum random module size">
                  </div>
                  <output data-bound-value="max" for="moduleScaleMax">100%</output>
                </div>
                <span id="moduleSizeCountControl" class="range-control" hidden>
                  <input id="moduleSizeCount" type="range" min="2" max="3" step="1" value="2" aria-label="Number of random module sizes">
                  <output id="moduleSizeCountValue" for="moduleSizeCount">2</output>
                </span>
              </div>
              <div class="range-field polygon-property style-property">
                <div class="property-heading">
                  <label for="moduleCornerRadius">Corner radius</label>
                  <button type="button" class="shuffle-button" data-module-random="moduleCornerRadius" aria-label="Randomize module corner radius" aria-pressed="false" aria-controls="moduleCornerRadiusControl moduleCornerRadiusRandomControl individualCornerControls" title="Randomize corner radius">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 3 3 3-3 3m0 6 3 3-3 3M3 6h2c5 0 9 12 14 12h2M3 18h2c5 0 9-12 14-12h2"/></svg>
                  </button>
                  <button id="individualCornersToggle" type="button" class="shuffle-button" aria-label="Edit corners individually" title="Edit corners individually" aria-pressed="false" aria-controls="individualCornerControls">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m6 0h6v-6"/></svg>
                  </button>
                </div>
                <span id="moduleCornerRadiusControl" class="range-control">
                  <input id="moduleCornerRadius" type="range" min="0" max="100" step="1" value="0" aria-label="Module corner radius">
                  <output id="moduleCornerRadiusValue" for="moduleCornerRadius">0%</output>
                </span>
                <div id="moduleCornerRadiusRandomControl" class="random-range" data-module-random-range="moduleCornerRadius" role="group" aria-label="Random module corner radius range" hidden>
                  <output data-bound-value="min" for="moduleCornerRadiusMin">0%</output>
                  <div class="random-range-track">
                    <span class="random-range-rail" aria-hidden="true"></span>
                    <input id="moduleCornerRadiusMin" type="range" min="0" max="100" step="1" value="0" data-bound="min" aria-label="Minimum random module corner radius">
                    <input id="moduleCornerRadiusMax" type="range" min="0" max="100" step="1" value="100" data-bound="max" aria-label="Maximum random module corner radius">
                  </div>
                  <output data-bound-value="max" for="moduleCornerRadiusMax">100%</output>
                </div>
                <div id="individualCornerControls" class="individual-corner-controls" role="group" aria-label="Individual corner radii" hidden></div>
              </div>
              <div class="range-field shape-property style-property">
                <div class="property-heading">
                  <label for="moduleRotation">Rotation</label>
                  <button type="button" class="shuffle-button" data-module-random="moduleRotation" aria-label="Randomize module rotation" aria-pressed="false" aria-controls="moduleRotationControl moduleRotationRandomControl" title="Randomize rotation">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 3 3 3-3 3m0 6 3 3-3 3M3 6h2c5 0 9 12 14 12h2M3 18h2c5 0 9-12 14-12h2"/></svg>
                  </button>
                  <button id="rotationQuarterTurnsToggle" type="button" class="shuffle-button" aria-label="Random 90° steps" title="Random 90° steps" aria-pressed="false" aria-controls="moduleRotationControl">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18m-4-4 4 4-4 4M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4"/></svg>
                  </button>
                </div>
                <span id="moduleRotationControl" class="range-control">
                  <input id="moduleRotation" type="range" min="0" max="360" step="1" value="0" aria-label="Module rotation">
                  <output id="moduleRotationValue" for="moduleRotation">0°</output>
                </span>
                <div id="moduleRotationRandomControl" class="random-range" data-module-random-range="moduleRotation" role="group" aria-label="Random module rotation range" hidden>
                  <output data-bound-value="min" for="moduleRotationMin">0°</output>
                  <div class="random-range-track">
                    <span class="random-range-rail" aria-hidden="true"></span>
                    <input id="moduleRotationMin" type="range" min="0" max="360" step="1" value="0" data-bound="min" aria-label="Minimum random module rotation">
                    <input id="moduleRotationMax" type="range" min="0" max="360" step="1" value="360" data-bound="max" aria-label="Maximum random module rotation">
                  </div>
                  <output data-bound-value="max" for="moduleRotationMax">360°</output>
                </div>
              </div>
              <div class="range-field module-merge-field style-property" role="group" aria-labelledby="moduleMergeLabel">
                <span id="moduleMergeLabel">Merge</span>
                <div class="merge-control">
                  <button type="button" data-module-merge="none" aria-pressed="true">None</button>
                  <button type="button" data-module-merge="all" aria-pressed="false">All</button>
                  <button type="button" data-module-merge="horizontal" aria-pressed="false">Horizontal</button>
                  <button type="button" data-module-merge="vertical" aria-pressed="false">Vertical</button>
                  <button type="button" data-module-merge="square-groups" aria-pressed="false">Square groups</button>
                </div>
              </div>
              <div class="range-field style-property">
                <div class="property-heading"><label for="moduleColorCount">Color</label></div>
                <span class="range-control">
                  <input id="moduleColorCount" type="range" min="1" max="4" step="1" value="1" aria-label="Number of module colors">
                  <output id="moduleColorCountValue" for="moduleColorCount">1</output>
                </span>
                <div id="moduleColorEditors" class="module-color-editors" role="group" aria-label="Module colors">
                  <span class="color-input-wrap">
                    <input id="moduleColor" type="color" value="#202020" aria-label="Module color 1">
                    <input id="moduleColorValue" class="hex-input" type="text" value="#202020" maxlength="7" spellcheck="false" aria-label="Module hex color 1 value">
                  </span>
                </div>
              </div>
            </div>
          </section>

          <section class="finder-patterns-section" aria-labelledby="finderPatternsTitle">
            <div class="finder-pattern-heading">
              <h2 id="finderPatternsTitle" class="section-title">Finder Patterns</h2>
              <div class="finder-edit-controls" role="group" aria-label="Finder pattern editing">
                <button id="editAllFinderPatterns" type="button" class="shuffle-button" aria-label="Edit all finder patterns" title="Edit all finder patterns" aria-pressed="true" aria-expanded="false" aria-controls="finderPatternSelector">
                  <svg data-finder-link="linked" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H7a5 5 0 0 0 0 10h2m6-10h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg>
                  <svg data-finder-link="unlinked" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H7a5 5 0 0 0 0 10h2m6-10h2a5 5 0 0 1 0 10h-2M8 12h2m4 0h2"/></svg>
                </button>
                <div id="finderPatternSelector" class="finder-pattern-control" role="group" aria-label="Finder pattern to edit" hidden>
                  <button type="button" class="shuffle-button" data-finder-pattern="0" aria-label="Top-left finder pattern" title="Top-left finder pattern" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19 5 5M5 17V5h12"/></svg></button>
                  <button type="button" class="shuffle-button" data-finder-pattern="1" aria-label="Top-right finder pattern" title="Top-right finder pattern" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg></button>
                  <button type="button" class="shuffle-button" data-finder-pattern="2" aria-label="Bottom-left finder pattern" title="Bottom-left finder pattern" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5 5 19M5 7v12h12"/></svg></button>
                </div>
              </div>
            </div>
            <div class="controls appearance-controls">
              <div class="style-controls">
                <label class="toggle-field marker-mode-toggle" for="markersAsModules">
                  <span>Markers as modules</span>
                  <span class="toggle-switch">
                    <input id="markersAsModules" type="checkbox" aria-controls="outerMarkerControls innerMarkerControls">
                    <span class="toggle-track" aria-hidden="true"></span>
                  </span>
                </label>
                <div id="outerMarkerControls" class="style-group">
                  <label class="field" for="outerMarkerStyle">
                    <span>Outer Marker</span>
                    <select id="outerMarkerStyle">
                      <option value="square">Square</option>
                      <option value="rounded" selected>Rounded</option>
                      <option value="outer-rounded">Rounded (outer)</option>
                      <option value="inner-rounded">Rounded (inner)</option>
                      <option value="opposite-inward-rounded">Rounded pair (inward)</option>
                      <option value="opposite-outward-rounded">Rounded pair (outward)</option>
                      <option value="circle">Circle</option>
                    </select>
                  </label>
                  <div class="color-field style-property">
                    <label for="outerMarkerColor">Color</label>
                    <span class="color-input-wrap">
                      <input id="outerMarkerColor" type="color" value="#202020" aria-label="Outer marker color">
                      <input id="outerMarkerColorValue" class="hex-input" type="text" value="#202020" maxlength="7" spellcheck="false" aria-label="Outer marker hex color value">
                    </span>
                  </div>
                  <label class="toggle-field style-property" for="cutOuterMarkerCorners">
                    <span>Cut corners</span>
                    <span class="toggle-switch">
                      <input id="cutOuterMarkerCorners" type="checkbox" aria-label="Cut outer marker corners">
                      <span class="toggle-track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-field style-property" for="outerMarkerCornersOnly">
                    <span>Corners only</span>
                    <span class="toggle-switch">
                      <input id="outerMarkerCornersOnly" type="checkbox" aria-label="Show only outer marker corners">
                      <span class="toggle-track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>

                <div id="innerMarkerControls" class="style-group">
                  <label class="field" for="innerMarkerStyle">
                    <span>Inner Marker</span>
                    <select id="innerMarkerStyle">
                      <option value="square">Square</option>
                      <option value="rounded" selected>Rounded</option>
                      <option value="outer-rounded">Rounded (outer)</option>
                      <option value="inner-rounded">Rounded (inner)</option>
                      <option value="opposite-inward-rounded">Rounded pair (inward)</option>
                      <option value="opposite-outward-rounded">Rounded pair (outward)</option>
                      <option value="circle">Circle</option>
                    </select>
                  </label>
                  <div class="color-field style-property">
                    <label for="innerMarkerColor">Color</label>
                    <span class="color-input-wrap">
                      <input id="innerMarkerColor" type="color" value="#202020" aria-label="Inner marker color">
                      <input id="innerMarkerColorValue" class="hex-input" type="text" value="#202020" maxlength="7" spellcheck="false" aria-label="Inner marker hex color value">
                    </span>
                  </div>
                </div>

              </div>
            </div>
          </section>

          <section class="controls logo-controls" aria-label="Logo">
            <div class="logo-title">Logo</div>
            <div id="logoDropZone" class="logo-upload-row" role="button" tabindex="0" aria-label="Upload SVG logo" aria-describedby="logoError">
              <input id="logoInput" class="visually-hidden" type="file" accept=".svg,image/svg+xml">
              <span id="logoFileName" class="logo-file-name">SVG · Max 5 MB</span>
              <button id="removeLogo" class="remove-logo" type="button" aria-label="Remove logo" title="Remove logo" hidden>&times;</button>
            </div>
            <p id="logoError" class="field-help error" role="alert" hidden></p>

            <div class="logo-area-controls" role="group" aria-labelledby="logoAreaTitle">
              <div id="logoAreaTitle" class="logo-title">Logo Area</div>
              <label class="toggle-field" for="showLogoArea">
                <span>Show guide</span>
                <span class="toggle-switch">
                  <input id="showLogoArea" type="checkbox">
                  <span class="toggle-track" aria-hidden="true"></span>
                </span>
              </label>

              <label class="toggle-field" for="clearLogoArea">
                <span>Clear</span>
                <span class="toggle-switch">
                  <input id="clearLogoArea" type="checkbox">
                  <span class="toggle-track" aria-hidden="true"></span>
                </span>
              </label>

              <label class="range-field logo-size-field" for="logoSize">
                <span>Size</span>
                <span class="range-control">
                  <input id="logoSize" type="range" min="10" max="30" value="20">
                  <output id="logoSizeValue" for="logoSize">20%</output>
                </span>
              </label>
            </div>
          </section>

          <section class="controls download-controls" aria-label="Download">
            <div class="export-row">
              <label class="visually-hidden" for="exportFormat">Format</label>
              <select id="exportFormat">
                <option value="png">PNG</option>
                <option value="svg" selected>SVG</option>
              </select>
              <label class="visually-hidden" for="exportSize">Size</label>
              <select id="exportSize">
                <option value="32">32 px</option>
                <option value="64">64 px</option>
                <option value="128">128 px</option>
                <option value="256" selected>256 px</option>
                <option value="512">512 px</option>
                <option value="1024">1024 px</option>
                <option value="2048">2048 px</option>
              </select>
              <button id="downloadButton" class="download-button" type="button" aria-label="Download" title="Download">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg>
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
