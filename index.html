<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="QR code generator with SVG and PNG export.">
    <title>QR Generator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/qrcode.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>QR Generator</h1>
        <div class="header-actions">
          <button id="resetButton" class="icon-button" type="button" aria-label="Reset" title="Reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <section id="canvasArea" class="canvas-area" aria-label="QR code preview">
          <svg id="qrPreview" role="img" aria-label="Generated QR code"></svg>
        </section>

        <section class="controls" aria-label="Controls">
          <label class="field prefix-field" for="prefixSelect">
            <span>Prefix</span>
            <select id="prefixSelect">
              <option value="https://" data-placeholder="example.com" data-inputmode="url" data-autocomplete="url" selected>Web secure</option>
              <option value="http://" data-placeholder="example.com" data-inputmode="url" data-autocomplete="url">Web</option>
              <option value="mailto:" data-placeholder="name@example.com" data-inputmode="email" data-autocomplete="email">Email</option>
              <option value="tel:" data-placeholder="+34 600 000 000" data-inputmode="tel" data-autocomplete="tel">Phone</option>
              <option value="sms:" data-placeholder="+34 600 000 000" data-inputmode="tel" data-autocomplete="tel">SMS</option>
              <option value="" data-placeholder="Text or address" data-inputmode="text" data-autocomplete="off">No prefix</option>
            </select>
          </label>

          <label class="field url-field" for="urlInput">
            <span>Link or content</span>
            <span id="urlInputWrap" class="url-input-wrap">
              <span id="prefixText" class="url-prefix">https://</span>
              <input id="urlInput" type="text" value="example.com" placeholder="example.com" inputmode="url" autocomplete="url" spellcheck="false" aria-describedby="prefixText urlHelp">
            </span>
          </label>
          <p id="urlHelp" class="field-help" aria-live="polite" hidden></p>

          <label class="field select-field" for="errorCorrection">
            <span>Error correction</span>
            <select id="errorCorrection">
              <option value="L">Low · 7%</option>
              <option value="M" selected>Medium · 15%</option>
              <option value="Q">Quartile · 25%</option>
              <option value="H">High · 30%</option>
            </select>
          </label>

          <div class="style-controls">
            <label class="field" for="moduleStyle">
              <span>Module style</span>
              <select id="moduleStyle">
                <option value="square" selected>Square</option>
                <option value="soft">Soft</option>
                <option value="rounded">Rounded</option>
                <option value="dots">Dots</option>
                <option value="circuit">Circuit</option>
              </select>
            </label>

            <label class="field" for="markerStyle">
              <span>Marker style</span>
              <select id="markerStyle">
                <option value="square" selected>Square</option>
                <option value="rounded">Rounded</option>
                <option value="circle">Circle</option>
              </select>
            </label>
          </div>

          <label class="range-field module-size-field" for="moduleScale">
            <span>Module size <output id="moduleScaleValue">100%</output></span>
            <input id="moduleScale" type="range" min="70" max="100" value="100">
          </label>

          <div class="color-controls">
            <div class="color-field">
              <label for="qrColor">Color</label>
              <span class="color-input-wrap">
                <input id="qrColor" type="color" value="#202020">
                <input id="qrColorValue" class="hex-input" type="text" value="#202020" maxlength="7" spellcheck="false" aria-label="Hex color value">
              </span>
            </div>
          </div>

          <div class="logo-controls">
            <div class="logo-title">Logo</div>
            <div id="logoDropZone" class="logo-upload-row" role="button" tabindex="0" aria-label="Upload SVG logo" aria-describedby="logoError">
              <input id="logoInput" class="visually-hidden" type="file" accept=".svg,image/svg+xml">
              <span id="logoFileName" class="logo-file-name">SVG · Max 5 MB</span>
              <button id="removeLogo" class="remove-logo" type="button" aria-label="Remove logo" title="Remove logo" hidden>&times;</button>
            </div>
            <p id="logoError" class="field-help error" role="alert" hidden></p>

            <label class="range-field logo-size-field" for="logoSize">
              <span>Area size <output id="logoSizeValue">20%</output></span>
              <input id="logoSize" type="range" min="10" max="30" value="20">
            </label>

            <label class="toggle-field" for="showLogoArea">
              <span>Show area</span>
              <span class="toggle-switch">
                <input id="showLogoArea" type="checkbox">
                <span class="toggle-track" aria-hidden="true"></span>
              </span>
            </label>

            <label class="toggle-field" for="clearLogoArea">
              <span>Clear area</span>
              <span class="toggle-switch">
                <input id="clearLogoArea" type="checkbox">
                <span class="toggle-track" aria-hidden="true"></span>
              </span>
            </label>
          </div>

          <div class="export-row">
            <label class="visually-hidden" for="exportFormat">Format</label>
            <select id="exportFormat">
              <option value="png" selected>PNG</option>
              <option value="svg">SVG</option>
            </select>
            <label class="visually-hidden" for="exportSize">Size</label>
            <select id="exportSize">
              <option value="32">32 px</option>
              <option value="64">64 px</option>
              <option value="128">128 px</option>
              <option value="256">256 px</option>
              <option value="512">512 px</option>
              <option value="1024" selected>1024 px</option>
              <option value="2048">2048 px</option>
            </select>
            <button id="downloadButton" class="download-button" type="button" aria-label="Download" title="Download">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg>
            </button>
          </div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
